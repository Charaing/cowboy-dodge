<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>총구를 피해라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --sand:#e9b872; --ink:#2b1a10; --red:#c4382a; --cream:#fff4e0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#1a0f08; color:var(--cream); font-family:'Noto Sans KR',sans-serif; overflow:hidden; }
  #game { display:block; width:100vw; height:100vh; }
  #cam { position:fixed; right:16px; bottom:16px; width:200px; max-width:35vw; border:3px solid var(--ink); border-radius:8px; transform:scaleX(-1); background:#000; opacity:.9; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(26,15,8,.78); text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  h1 { font-family:'Black Han Sans',sans-serif; font-size:clamp(40px,9vw,88px); margin:0; color:var(--sand); text-shadow:4px 4px 0 var(--ink); letter-spacing:2px; }
  p { margin:0; max-width:560px; line-height:1.6; }
  button { font-family:'Black Han Sans',sans-serif; font-size:24px; padding:12px 32px; border:3px solid var(--ink); background:var(--sand); color:var(--ink); border-radius:8px; cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
  button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  button.secondary { font-size:16px; padding:8px 18px; background:var(--cream); }
  #status { font-size:14px; opacity:.8; min-height:20px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="cam" autoplay playsinline muted></video>
<div id="overlay">
  <h1>총구를 피해라</h1>
  <p id="desc">카우보이가 총을 겨눕니다. <b>총구 방향</b>을 잘 보고 <b>몸(얼굴)을 좌우로 움직여</b> 총알을 피하세요!<br>웹캠이 당신의 얼굴 위치를 인식합니다. 카메라에서 1~2m 떨어져 서면 좋아요.</p>
  <button id="start">카메라로 시작</button>
  <button id="keys" class="secondary">카메라 없이 (← → 키)</button>
  <div id="status"></div>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const video = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const keysBtn = document.getElementById('keys');
const descEl = document.getElementById('desc');
const titleEl = overlay.querySelector('h1');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- input ----------
let detector = null;
let useCamera = false;
let playerX = 0.5;        // 0..1 smoothed
let targetX = 0.5;
let faceSeen = false;
let lastVideoTime = -1;
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

async function initCamera() {
  statusEl.textContent = '카메라 권한을 요청하는 중...';
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
  video.srcObject = stream;
  await new Promise(r => video.onloadeddata = r);
  statusEl.textContent = '얼굴 인식 모델 불러오는 중...';
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  detector = await FaceDetector.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    minDetectionConfidence: 0.5
  });
  useCamera = true;
}

function updateInput(dt) {
  if (useCamera && detector && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = detector.detectForVideo(video, performance.now());
    if (res.detections.length) {
      const b = res.detections[0].boundingBox;
      const cx = (b.originX + b.width / 2) / video.videoWidth;
      // mirror, then stretch the middle 70% of the frame to the full play width
      const m = 1 - cx;
      targetX = Math.min(1, Math.max(0, (m - 0.15) / 0.7));
      faceSeen = true;
    } else {
      faceSeen = false;
    }
  }
  if (!useCamera) {
    faceSeen = true;
    const sp = 1.6 * dt;
    if (keys['ArrowLeft'] || keys['a']) targetX -= sp;
    if (keys['ArrowRight'] || keys['d']) targetX += sp;
    targetX = Math.min(1, Math.max(0, targetX));
  }
  playerX += (targetX - playerX) * Math.min(1, dt * 14);
}

// ---------- game state ----------
const LANES = [1/6, 3/6, 5/6];
let state = 'menu';       // menu | ready | aim | fire | gap | over
let timer = 0;
let score = 0, lives = 3, best = 0;
let aimLane = 1, fakeLane = -1, swapAt = 0;
let gunAngle = 0, gunTarget = 0;
let bullet = null;
let flash = 0, shake = 0, hitFlash = 0;
let msg = '', msgT = 0;
let dust = [];
try { best = +localStorage.getItem('cowboy-best') || 0; } catch {}

function laneOf(x) { return x < 1/3 ? 0 : x < 2/3 ? 1 : 2; }
function difficulty() { return Math.min(1, score / 25); }

function geom() {
  const groundY = H * 0.86;
  const cowboy = { x: W / 2, y: H * 0.30, s: Math.min(W, H) / 520 };
  const gun = { x: cowboy.x + 34 * cowboy.s, y: cowboy.y + 30 * cowboy.s };
  return { groundY, cowboy, gun };
}
function angleToLane(l) {
  const { groundY, gun } = geom();
  return Math.atan2(groundY - 60 - gun.y, LANES[l] * W - gun.x);
}

function startGame() {
  score = 0; lives = 3; state = 'ready'; timer = 2.2; bullet = null;
  gunTarget = Math.PI / 2; gunAngle = gunTarget;
  overlay.classList.add('hidden');
}

function nextRound() {
  const d = difficulty();
  state = 'aim';
  aimLane = Math.floor(Math.random() * 3);
  timer = 1.5 - d * 0.85 + Math.random() * 0.4;
  // fake-out: point somewhere else first, then swing to the real lane
  fakeLane = -1;
  if (score >= 5 && Math.random() < 0.15 + d * 0.35) {
    fakeLane = (aimLane + 1 + Math.floor(Math.random() * 2)) % 3;
    swapAt = timer * (0.45 + Math.random() * 0.15);
    gunTarget = angleToLane(fakeLane);
  } else {
    gunTarget = angleToLane(aimLane);
  }
}

function fire() {
  state = 'fire';
  const { gun, groundY } = geom();
  const a = angleToLane(aimLane);
  const len = 70 * geom().cowboy.s;
  bullet = { x: gun.x + Math.cos(a) * len, y: gun.y + Math.sin(a) * len, vx: Math.cos(a), vy: Math.sin(a), speed: H * 2.6, endY: groundY - 60 };
  flash = 0.12; shake = 0.25;
  beep(110, 0.18, 'sawtooth', 0.25);
}

function resolveShot() {
  const px = playerX * W;
  const halfW = W / 6 * 0.62;
  const hit = Math.abs(bullet.x - px) < halfW;
  if (hit) {
    lives--; hitFlash = 0.5; shake = 0.5;
    showMsg('맞았다!');
    beep(70, 0.4, 'square', 0.3);
    if (lives <= 0) return gameOver();
  } else {
    score++;
    showMsg(['피했다!', '좋아!', '아슬아슬!', '날렵해!'][Math.floor(Math.random() * 4)]);
    beep(660, 0.08, 'triangle', 0.15);
    for (let i = 0; i < 10; i++) dust.push({ x: bullet.x, y: bullet.endY, vx: (Math.random() - .5) * 200, vy: -Math.random() * 160, t: .6 });
  }
  bullet = null;
  state = 'gap';
  timer = 0.9 - difficulty() * 0.4;
  gunTarget = Math.PI / 2;
}

function gameOver() {
  state = 'over';
  bullet = null;
  if (score > best) { best = score; try { localStorage.setItem('cowboy-best', best); } catch {} }
  titleEl.textContent = '쓰러졌다...';
  descEl.innerHTML = `피한 총알: <b>${score}</b>발 · 최고 기록: <b>${best}</b>발`;
  startBtn.textContent = '다시 하기';
  keysBtn.style.display = 'none';
  statusEl.textContent = '';
  overlay.classList.remove('hidden');
}

function showMsg(t) { msg = t; msgT = 0.8; }

// ---------- sound ----------
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.4), actx.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

// ---------- update ----------
function update(dt) {
  updateInput(dt);
  gunAngle += (gunTarget - gunAngle) * Math.min(1, dt * 9);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - dt);
  hitFlash = Math.max(0, hitFlash - dt); msgT = Math.max(0, msgT - dt);
  dust = dust.filter(p => (p.t -= dt) > 0);
  dust.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; });

  if (state === 'ready') {
    timer -= dt;
    if (timer <= 0) nextRound();
  } else if (state === 'aim') {
    timer -= dt;
    if (fakeLane >= 0 && timer <= swapAt) { fakeLane = -1; gunTarget = angleToLane(aimLane); beep(300, 0.05, 'square', 0.08); }
    if (timer <= 0) fire();
  } else if (state === 'fire' && bullet) {
    bullet.x += bullet.vx * bullet.speed * dt;
    bullet.y += bullet.vy * bullet.speed * dt;
    if (bullet.y >= bullet.endY) resolveShot();
  } else if (state === 'gap') {
    timer -= dt;
    if (timer <= 0) nextRound();
  }
}

// ---------- drawing ----------
function drawBackground(groundY) {
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#f28b3c'); sky.addColorStop(0.6, '#f6c26b'); sky.addColorStop(1, '#f9dca0');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, groundY);
  // sun
  ctx.fillStyle = '#fff1c1';
  ctx.beginPath(); ctx.arc(W * 0.18, H * 0.2, Math.min(W, H) * 0.08, 0, Math.PI * 2); ctx.fill();
  // mesas
  ctx.fillStyle = '#b5552e';
  ctx.beginPath();
  ctx.moveTo(0, groundY * 0.72); ctx.lineTo(W * 0.06, groundY * 0.72); ctx.lineTo(W * 0.1, groundY * 0.62);
  ctx.lineTo(W * 0.24, groundY * 0.62); ctx.lineTo(W * 0.28, groundY * 0.74); ctx.lineTo(W * 0.66, groundY * 0.74);
  ctx.lineTo(W * 0.7, groundY * 0.58); ctx.lineTo(W * 0.86, groundY * 0.58); ctx.lineTo(W * 0.9, groundY * 0.7);
  ctx.lineTo(W, groundY * 0.7); ctx.lineTo(W, groundY); ctx.lineTo(0, groundY); ctx.fill();
  // ground
  const g = ctx.createLinearGradient(0, groundY * 0.75, 0, H);
  g.addColorStop(0, '#d99a55'); g.addColorStop(1, '#a8642f');
  ctx.fillStyle = g; ctx.fillRect(0, groundY * 0.76, W, H);
  // lane marks
  ctx.strokeStyle = 'rgba(80,40,15,.25)'; ctx.lineWidth = 2; ctx.setLineDash([10, 12]);
  for (const x of [W / 3, W * 2 / 3]) { ctx.beginPath(); ctx.moveTo(x, groundY - 140); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.setLineDash([]);
}

function drawCowboy(c, angle) {
  const s = c.s;
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s);
  // shadow
  ctx.fillStyle = 'rgba(60,30,10,.3)'; ctx.beginPath(); ctx.ellipse(0, 150, 60, 12, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.fillStyle = '#3a4a6b'; ctx.fillRect(-26, 70, 20, 78); ctx.fillRect(6, 70, 20, 78);
  ctx.fillStyle = '#4a2a14'; ctx.fillRect(-30, 140, 26, 12); ctx.fillRect(4, 140, 26, 12);
  // body + vest
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-34, -10, 68, 84);
  ctx.fillStyle = '#6b3a1e'; ctx.fillRect(-34, -10, 22, 84); ctx.fillRect(12, -10, 22, 84);
  ctx.fillStyle = '#3b2010'; ctx.fillRect(-34, 62, 68, 10);
  ctx.fillStyle = '#e2b84a'; ctx.fillRect(-6, 62, 12, 10);
  // left arm (idle)
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-48, -6, 16, 60);
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(-40, 58, 9, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(0, -36, 26, 0, Math.PI * 2); ctx.fill();
  // bandana
  ctx.fillStyle = '#c4382a';
  ctx.beginPath(); ctx.moveTo(-24, -30); ctx.lineTo(24, -30); ctx.lineTo(0, -6); ctx.fill();
  // eyes (narrowed, following the aim)
  const look = Math.cos(angle) * 4;
  ctx.fillStyle = '#2b1a10'; ctx.fillRect(-13 + look, -44, 9, 3); ctx.fillRect(4 + look, -44, 9, 3);
  // hat
  ctx.fillStyle = '#5a3418';
  ctx.beginPath(); ctx.ellipse(0, -56, 50, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-26, -56); ctx.lineTo(-22, -92); ctx.quadraticCurveTo(0, -84, 22, -92); ctx.lineTo(26, -56); ctx.fill();
  ctx.fillStyle = '#2b1a10'; ctx.fillRect(-26, -64, 52, 6);
  ctx.restore();
}

function drawGun(gun, angle, s) {
  ctx.save(); ctx.translate(gun.x, gun.y); ctx.rotate(angle); ctx.scale(s, s);
  // arm
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-6, -8, 34, 16);
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(32, 0, 9, 0, Math.PI * 2); ctx.fill();
  // revolver
  ctx.fillStyle = '#4a2a14'; ctx.save(); ctx.translate(34, 4); ctx.rotate(0.5); ctx.fillRect(-4, 0, 10, 20); ctx.restore();
  ctx.fillStyle = '#5e646e'; ctx.fillRect(30, -10, 16, 14);
  ctx.fillStyle = '#8a919c'; ctx.fillRect(44, -8, 30, 7);
  ctx.fillStyle = '#2b2f36'; ctx.fillRect(72, -8, 3, 7);
  // muzzle flash
  if (flash > 0) {
    ctx.fillStyle = '#fff3a0';
    ctx.beginPath(); ctx.moveTo(76, -4);
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const r = i % 2 ? 10 : 28; ctx.lineTo(76 + Math.cos(a) * r + 10, -4 + Math.sin(a) * r); }
    ctx.fill();
  }
  ctx.restore();
}

function drawPlayer(groundY) {
  const x = playerX * W, y = groundY - 30;
  const lane = laneOf(playerX);
  ctx.fillStyle = 'rgba(60,30,10,.3)'; ctx.beginPath(); ctx.ellipse(x, groundY + 40, 46, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(x, y);
  if (hitFlash > 0) ctx.rotate(Math.sin(hitFlash * 40) * 0.15);
  ctx.globalAlpha = faceSeen ? 1 : 0.4;
  ctx.fillStyle = hitFlash > 0 ? '#c4382a' : '#2f6f8f';
  ctx.beginPath(); ctx.roundRect(-30, -10, 60, 80, 14); ctx.fill();
  ctx.fillStyle = '#f0c9a0'; ctx.beginPath(); ctx.arc(0, -36, 24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b1a10'; ctx.fillRect(-9, -40, 5, 5); ctx.fillRect(5, -40, 5, 5);
  ctx.restore();
  ctx.globalAlpha = 1;
  // current lane highlight
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(lane * W / 3, groundY - 140, W / 3, H);
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `28px 'Black Han Sans', sans-serif`;
  ctx.fillStyle = '#2b1a10'; ctx.fillText(`점수 ${score}`, 18, 16);
  ctx.font = `16px 'Noto Sans KR', sans-serif`; ctx.fillText(`최고 ${best}`, 18, 50);
  ctx.textAlign = 'right'; ctx.font = `28px sans-serif`;
  ctx.fillText('❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives)), W - 18, 16);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'ready') {
    ctx.font = `${Math.min(W, H) * 0.12}px 'Black Han Sans', sans-serif`;
    ctx.fillStyle = '#2b1a10';
    ctx.fillText(timer > 1.2 ? '준비...' : '결투!', W / 2, H * 0.62);
  }
  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT * 2);
    ctx.font = `${Math.min(W, H) * 0.08}px 'Black Han Sans', sans-serif`;
    ctx.fillStyle = hitFlash > 0 ? '#c4382a' : '#fff4e0';
    ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = 6;
    ctx.strokeText(msg, W / 2, H * 0.6); ctx.fillText(msg, W / 2, H * 0.6);
    ctx.globalAlpha = 1;
  }
  if (useCamera && !faceSeen && state !== 'menu' && state !== 'over') {
    ctx.font = `20px 'Noto Sans KR', sans-serif`; ctx.fillStyle = '#c4382a';
    ctx.fillText('얼굴이 안 보여요! 카메라 앞으로 오세요', W / 2, 90);
  }
}

function draw() {
  const { groundY, cowboy, gun } = geom();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 16 * shake, (Math.random() - .5) * 16 * shake);
  drawBackground(groundY);
  drawCowboy(cowboy, gunAngle);
  drawGun(gun, gunAngle, cowboy.s);
  drawPlayer(groundY);
  if (bullet) {
    ctx.strokeStyle = 'rgba(255,240,170,.8)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(bullet.x - bullet.vx * 40, bullet.y - bullet.vy * 40); ctx.lineTo(bullet.x, bullet.y); ctx.stroke();
    ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.arc(bullet.x, bullet.y, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#c99a5e';
  dust.forEach(p => { ctx.globalAlpha = p.t / .6; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); });
  ctx.globalAlpha = 1;
  ctx.restore();
  if (hitFlash > 0) { ctx.fillStyle = `rgba(196,56,42,${hitFlash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

startBtn.addEventListener('click', async () => {
  beep(440, 0.01, 'sine', 0.01); // unlock audio
  if (state === 'over' || useCamera) return startGame();
  startBtn.disabled = true;
  try {
    await initCamera();
    statusEl.textContent = '';
    startGame();
  } catch (e) {
    console.error(e);
    statusEl.textContent = '카메라를 사용할 수 없어요. 키보드 모드로 해보세요. (' + (e.message || e.name) + ')';
  } finally {
    startBtn.disabled = false;
  }
});
keysBtn.addEventListener('click', () => {
  beep(440, 0.01, 'sine', 0.01);
  useCamera = false; video.style.display = 'none';
  startGame();
});
</script>
</body>
</html>

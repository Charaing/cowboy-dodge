<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>총구를 피해라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --sand:#e9b872; --ink:#2b1a10; --red:#c4382a; --cream:#fff4e0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#1a0f08; color:var(--cream); font-family:'Noto Sans KR',sans-serif; overflow:hidden; }
  #game { display:block; width:100vw; height:100vh; }
  #cam { position:fixed; right:16px; bottom:16px; width:180px; max-width:30vw; border:3px solid var(--ink); border-radius:8px; transform:scaleX(-1); background:#000; opacity:.85; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(26,15,8,.8); text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  h1 { font-family:'Black Han Sans',sans-serif; font-size:clamp(40px,9vw,88px); margin:0; color:var(--sand); text-shadow:4px 4px 0 var(--ink); letter-spacing:2px; }
  p { margin:0; max-width:580px; line-height:1.7; }
  button { font-family:'Black Han Sans',sans-serif; font-size:24px; padding:12px 32px; border:3px solid var(--ink); background:var(--sand); color:var(--ink); border-radius:8px; cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
  button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  button.secondary { font-size:16px; padding:8px 18px; background:var(--cream); }
  #status { font-size:14px; opacity:.8; min-height:20px; }
  .opts { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  .opts > span { font-weight:700; color:var(--sand); min-width:72px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .chips button { font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:15px; padding:6px 12px; box-shadow:2px 2px 0 var(--ink); background:var(--cream); }
  .chips button.on { background:var(--red); color:var(--cream); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="cam" autoplay playsinline muted></video>
<div id="overlay">
  <h1>총구를 피해라</h1>
  <p id="desc">카우보이가 총을 <b>허리춤 총집</b>에 넣고 당신을 노려봅니다.<br>
  갑자기 총을 뽑아 <b>왼쪽이나 오른쪽</b>을 겨누면 —<br>
  <b>정해진 시간</b> 안에 얼굴을 <b>총구 반대 방향</b>으로 피하세요!<br>
  <small>매 판 시작 전엔 얼굴을 가운데에 두세요. 미리 움직이면 카우보이가 기다립니다.<br>
  웹캠이 얼굴 위치를 인식해요. 카메라에서 1m 정도 떨어져 앉으세요.</small></p>
  <div class="opts"><span>반응 시간</span><div class="chips" id="reactOpts"></div></div>
  <div class="opts"><span>얼굴 감도</span><div class="chips" id="sensOpts"></div></div>
  <button id="start">카메라로 시작</button>
  <button id="keys" class="secondary">카메라 없이 (← → 키)</button>
  <div id="status"></div>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// reaction window in seconds, counted from the moment the gun is aimed (override with ?t=0.3)
let REACT = 0.2;
const REACT_CHOICES = [0.15, 0.2, 0.3, 0.4, 0.5, 0.7];
// camera frames arrive a few tens of ms late, so the camera mode gets that time back
const CAM_LAG = 0.05;
// how far (in metres of game space) one full camera-frame width of face movement takes you
let GAIN = 3;
const SENS_CHOICES = [['낮음', 2], ['보통', 3], ['높음', 4.5], ['아주 높음', 6]];
const DRAW_TIME = 0.09;      // holster -> aimed animation
const SAFE_X = 0.12;         // metres the head must be on the safe side when he fires
const CENTER_X = 0.08;       // "in the middle" tolerance between rounds
const EARLY_X = 0.11;        // moving this far before the draw counts as jumping the gun
const COWBOY_Z = 3.2;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const video = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const keysBtn = document.getElementById('keys');
const descEl = document.getElementById('desc');
const titleEl = overlay.querySelector('h1');

// ---------- options ----------
const params = new URLSearchParams(location.search);
try {
  REACT = +localStorage.getItem('cowboy-react') || REACT;
  GAIN = +localStorage.getItem('cowboy-gain') || GAIN;
} catch {}
if (+params.get('t')) REACT = +params.get('t');

function chips(el, items, isOn, pick) {
  const render = () => {
    el.innerHTML = '';
    for (const [label, val] of items) {
      const b = document.createElement('button');
      b.textContent = label;
      if (isOn(val)) b.className = 'on';
      b.onclick = () => { pick(val); render(); };
      el.appendChild(b);
    }
  };
  render();
}
chips(document.getElementById('reactOpts'), REACT_CHOICES.map(v => [`${v}초`, v]), v => v === REACT,
  v => { REACT = v; try { localStorage.setItem('cowboy-react', v); } catch {} });
chips(document.getElementById('sensOpts'), SENS_CHOICES, v => v === GAIN,
  v => { GAIN = v; try { localStorage.setItem('cowboy-gain', v); } catch {} });

let W = 0, H = 0, F = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  F = Math.min(W, H) * 1.5;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- head tracking ----------
// head = player's eye position in metres, relative to the neutral spot (x right, y up)
const head = { x: 0, y: 0 };      // raw, used for judging
const view = { x: 0, y: 0 };      // smoothed, used for the camera
let detector = null, useCamera = false, faceSeen = true, lastVideoTime = -1;
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

async function initCamera() {
  statusEl.textContent = '카메라 권한을 요청하는 중...';
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, frameRate: { ideal: 60 }, facingMode: 'user' }, audio: false });
  video.srcObject = stream;
  await new Promise(r => video.onloadeddata = r);
  statusEl.textContent = '얼굴 인식 모델 불러오는 중...';
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  detector = await FaceDetector.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    minDetectionConfidence: 0.5
  });
  useCamera = true;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

// the middle of the frame is calibrated at the start of each game
let calib = { x: 0.5, y: 0.42 }, rawFace = null;

function updateInput(dt) {
  if (useCamera && detector && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = detector.detectForVideo(video, performance.now());
    if (res.detections.length) {
      const b = res.detections[0].boundingBox;
      rawFace = { x: (b.originX + b.width / 2) / video.videoWidth, y: (b.originY + b.height / 2) / video.videoHeight };
      head.x = clamp((calib.x - rawFace.x) * GAIN, -0.6, 0.6);   // mirrored
      head.y = clamp((calib.y - rawFace.y) * 1.0, -0.4, 0.3);
      faceSeen = true;
    } else {
      faceSeen = false;
    }
  }
  if (!useCamera) {
    // arrow keys lean you to a side; release to come back to the middle
    const tx = keys['ArrowLeft'] ? -0.35 : keys['ArrowRight'] ? 0.35 : 0;
    const step = 6 * dt;
    head.x += clamp(tx - head.x, -step, step);
    head.y = 0;
  }
  const k = Math.min(1, dt * 30);
  view.x += (head.x - view.x) * k; view.y += (head.y - view.y) * k;
}

// ---------- 3D helpers ----------
function proj(x, y, z) {
  const s = F / z;
  return { x: W / 2 + (x - view.x) * s, y: H * 0.45 - (y - view.y) * s, s };
}
const norm = v => { const l = Math.hypot(v.x, v.y, v.z) || 1; return { x: v.x / l, y: v.y / l, z: v.z / l }; };

// ---------- game state ----------
// menu | ready | center | tense | draw | aimed | gap | over
let state = 'menu';
let timer = 0, score = 0, lives = 3, best = 0;
let side = 1;                 // -1: gun points to your left, +1: to your right
let drawT = 0;                // 0 holstered .. 1 aimed
let aimedT = 0, escapedAt = -1;
let twitch = 0, twitchAt = -1, centerHold = 0;
let flash = 0, shake = 0, hitFlash = 0, crack = null;
let msg = '', sub = '', msgT = 0;
let reactions = [];
try { best = +localStorage.getItem('cowboy-draw-best') || 0; } catch {}

function startGame() {
  score = 0; lives = 3; reactions = []; crack = null; drawT = 0;
  if (useCamera && rawFace) calib = { ...rawFace };
  state = 'ready'; timer = 2;
  overlay.classList.add('hidden');
}

function toCenter() { state = 'center'; centerHold = 0; drawT = 0; }

function newTense() {
  state = 'tense';
  const d = Math.min(1, score / 15);
  timer = 1 + Math.random() * (3 - d);
  // fake twitch once you have a few points
  twitchAt = score >= 3 && Math.random() < 0.3 + d * 0.4 ? timer * (0.3 + Math.random() * 0.5) : -1;
}

function startDraw() {
  state = 'draw';
  side = Math.random() < 0.5 ? -1 : 1;
  drawT = 0;
  whoosh();
}

function fire() {
  flash = 0.1; shake = 0.35;
  bang();
  const safe = head.x * -side > SAFE_X;
  if (!safe) {
    lives--; hitFlash = 0.7;
    crack = { x: W / 2 + side * W * 0.12, y: H * 0.45, seed: Math.random() * 1000 };
    const towards = head.x * side > SAFE_X;
    showMsg('맞았다!', towards ? '총구 쪽으로 피했어요! 반대로!' : `${REACT}초 안에 피하지 못했어요`);
  } else {
    score++;
    const rt = escapedAt >= 0 ? escapedAt : REACT;
    reactions.push(rt);
    showMsg(['피했다!', '빠르다!', '아슬아슬!', '총알보다 빨라!'][Math.floor(Math.random() * 4)], `반응 ${rt.toFixed(3)}초`);
  }
  state = 'gap';
  timer = 1.2;
  if (lives <= 0) setTimeout(gameOver, 1000);
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('cowboy-draw-best', best); } catch {} }
  const avg = reactions.length ? (reactions.reduce((a, b) => a + b, 0) / reactions.length).toFixed(3) + '초' : '-';
  titleEl.textContent = '쓰러졌다...';
  descEl.innerHTML = `피한 총알 <b>${score}</b>발 · 평균 반응 <b>${avg}</b><br>최고 기록 <b>${best}</b>발`;
  startBtn.textContent = '다시 결투';
  keysBtn.style.display = 'none';
  statusEl.textContent = '';
  overlay.classList.remove('hidden');
}

function showMsg(t, s = '') { msg = t; sub = s; msgT = 1; }

// ---------- sound ----------
let actx = null;
function audio() { return actx = actx || new AudioContext(); }
function noise(dur, vol, curve, freq) {
  try {
    const a = audio(), len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, curve);
    const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq;
    src.buffer = buf; g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination); src.start();
  } catch {}
}
const bang = () => noise(0.4, 1.2, 3, 900);
const whoosh = () => noise(0.08, 0.3, 1, 3000);

// ---------- update ----------
function update(dt) {
  updateInput(dt);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - dt);
  hitFlash = Math.max(0, hitFlash - dt); msgT = Math.max(0, msgT - dt * 0.9);
  twitch = Math.max(0, twitch - dt * 5);

  if (state === 'ready') {
    timer -= dt;
    if (timer <= 0) toCenter();
  } else if (state === 'center') {
    centerHold = Math.abs(head.x) < CENTER_X && faceSeen ? centerHold + dt : 0;
    if (centerHold > 0.4) newTense();
  } else if (state === 'tense') {
    if (Math.abs(head.x) > EARLY_X) { showMsg('움직이지 마!', '가운데로 돌아오세요'); toCenter(); return; }
    timer -= dt;
    if (twitchAt >= 0 && timer <= twitchAt) { twitch = 1; twitchAt = -1; }
    if (timer <= 0) startDraw();
  } else if (state === 'draw') {
    drawT = Math.min(1, drawT + dt / DRAW_TIME);
    if (drawT >= 1) { state = 'aimed'; aimedT = 0; escapedAt = -1; }
  } else if (state === 'aimed') {
    aimedT += dt;
    if (escapedAt < 0 && head.x * -side > SAFE_X) escapedAt = aimedT;
    if (aimedT >= REACT + (useCamera ? CAM_LAG : 0)) fire();
  } else if (state === 'gap') {
    timer -= dt;
    if (timer <= 0 && lives > 0) toCenter();
  }
}

// ---------- drawing ----------
function drawWorld() {
  const hor = proj(0, -1.6, 1e4).y;
  const sky = ctx.createLinearGradient(0, 0, 0, hor);
  sky.addColorStop(0, '#e9763a'); sky.addColorStop(0.7, '#f6c26b'); sky.addColorStop(1, '#fbe2a8');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hor + 2);

  const sun = proj(-14, 3, 80);
  ctx.fillStyle = '#fff1c1'; ctx.beginPath(); ctx.arc(sun.x, sun.y, F * 0.05, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#b5552e';
  const mesa = (x0, x1, h, z) => {
    const a = proj(x0, -1.6, z), b = proj(x1, -1.6 + h, z);
    ctx.beginPath(); ctx.moveTo(a.x - 30, a.y); ctx.lineTo(a.x, b.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + 30, a.y); ctx.fill();
  };
  mesa(-30, -16, 7, 60); mesa(10, 30, 9, 70); mesa(-60, -40, 5, 70); mesa(40, 55, 6, 60);

  const g = ctx.createLinearGradient(0, hor, 0, H);
  g.addColorStop(0, '#d99a55'); g.addColorStop(1, '#8f5326');
  ctx.fillStyle = g; ctx.fillRect(0, hor, W, H - hor);

  const c = proj(-2.2, -1.6, 7), u = c.s;
  ctx.fillStyle = '#4f7a3a';
  ctx.fillRect(c.x - 0.12 * u, c.y - 1.6 * u, 0.24 * u, 1.6 * u);
  ctx.fillRect(c.x - 0.45 * u, c.y - 1.1 * u, 0.33 * u, 0.16 * u);
  ctx.fillRect(c.x - 0.45 * u, c.y - 1.45 * u, 0.16 * u, 0.5 * u);
}

function drawCowboy() {
  const chest = proj(0, -0.35, COWBOY_Z);
  const s = chest.s / 135; // art units -> metres (~135 units per metre)
  ctx.save(); ctx.translate(chest.x, chest.y); ctx.scale(s, s);
  ctx.fillStyle = '#3a4a6b'; ctx.fillRect(-30, 70, 24, 140); ctx.fillRect(6, 70, 24, 140);
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-40, -12, 80, 88);
  ctx.fillStyle = '#6b3a1e'; ctx.fillRect(-40, -12, 26, 88); ctx.fillRect(14, -12, 26, 88);
  ctx.fillStyle = '#e2b84a'; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4 : 9; ctx.lineTo(-27 + Math.cos(a) * r, 18 + Math.sin(a) * r); }
  ctx.fill();
  // gun belt
  ctx.fillStyle = '#3b2010'; ctx.fillRect(-42, 66, 84, 11);
  ctx.fillStyle = '#e2b84a'; ctx.fillRect(-6, 66, 12, 11);
  // left arm hanging
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-56, -8, 18, 70);
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(-47, 66, 10, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(0, -38, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c4382a'; ctx.beginPath(); ctx.moveTo(-26, -30); ctx.lineTo(26, -30); ctx.lineTo(0, -4); ctx.fill();
  // eyes: stare at you, flick to the target on the draw
  const look = state === 'draw' || state === 'aimed' ? side * 5 : clamp(view.x * 8, -4, 4);
  const narrow = state === 'tense' || state === 'draw' || state === 'aimed';
  ctx.fillStyle = '#2b1a10';
  ctx.fillRect(-14 + look, -46, 10, narrow ? 2 : 4); ctx.fillRect(4 + look, -46, 10, narrow ? 2 : 4);
  ctx.fillRect(-16, narrow ? -51 : -54, 13, 3); ctx.fillRect(3, narrow ? -51 : -54, 13, 3);
  // hat
  ctx.fillStyle = '#5a3418';
  ctx.beginPath(); ctx.ellipse(0, -60, 58, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, -60); ctx.lineTo(-25, -100); ctx.quadraticCurveTo(0, -90, 25, -100); ctx.lineTo(30, -60); ctx.fill();
  ctx.fillStyle = '#2b1a10'; ctx.fillRect(-30, -69, 60, 7);
  ctx.restore();
}

// holster sits on the cowboy's right hip (screen right)
const HIP = { x: 0.36, y: -0.95, z: COWBOY_Z };
const SHOULDER = { x: 0.32, y: -0.38, z: COWBOY_Z };
const AIM_HAND = { x: 0.14, y: -0.28, z: COWBOY_Z - 1.3 };

function drawHolster() {
  const p = proj(HIP.x, HIP.y, HIP.z), u = p.s;
  ctx.fillStyle = '#5a3418';
  ctx.beginPath();
  ctx.moveTo(p.x - 0.06 * u, p.y - 0.05 * u); ctx.lineTo(p.x + 0.07 * u, p.y - 0.05 * u);
  ctx.lineTo(p.x + 0.05 * u, p.y + 0.28 * u); ctx.lineTo(p.x - 0.02 * u, p.y + 0.3 * u); ctx.fill();
  ctx.strokeStyle = '#e2b84a'; ctx.lineWidth = 0.008 * u; ctx.stroke();
}

function drawGrip(p) {
  const u = p.s;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-0.35);
  ctx.fillStyle = '#4a2a14'; ctx.beginPath(); ctx.roundRect(-0.025 * u, -0.12 * u, 0.05 * u, 0.12 * u, 0.012 * u); ctx.fill();
  ctx.fillStyle = '#5e646e'; ctx.fillRect(-0.03 * u, -0.01 * u, 0.06 * u, 0.04 * u);
  ctx.restore();
}

function drawArmAndGun() {
  drawHolster();
  // hand path: hovering over the holster -> extended toward you
  const hover = { x: HIP.x + 0.04, y: HIP.y + 0.18 + twitch * 0.06, z: HIP.z - 0.05 };
  const t = 1 - Math.pow(1 - drawT, 3);
  const hand = { x: lerp(hover.x, AIM_HAND.x, t), y: lerp(hover.y, AIM_HAND.y, t), z: lerp(hover.z, AIM_HAND.z, t) };
  const ps = proj(SHOULDER.x, SHOULDER.y, SHOULDER.z), ph = proj(hand.x, hand.y, hand.z);

  if (drawT === 0) drawGrip(proj(HIP.x, HIP.y + 0.02, HIP.z - 0.06));

  ctx.lineCap = 'round';
  ctx.strokeStyle = '#b8925c'; ctx.lineWidth = 0.13 * ph.s;
  ctx.beginPath(); ctx.moveTo(ps.x, ps.y); ctx.lineTo(ph.x, ph.y); ctx.stroke();

  if (drawT === 0) {
    // twitchy fingers over the grip
    ctx.fillStyle = '#e8b48a';
    ctx.beginPath(); ctx.arc(ph.x, ph.y, 0.055 * ph.s, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const wig = Math.sin(performance.now() / 90 + i) * 0.006 * (state === 'tense' ? 1 : 0.3);
      ctx.fillRect(ph.x - 0.04 * ph.s + i * 0.022 * ph.s, ph.y + 0.03 * ph.s, 0.014 * ph.s, (0.05 + wig) * ph.s);
    }
    return;
  }

  // gun direction: from pointing down (in the holster) to the chosen side of your head
  const target = { x: side * 0.5, y: 0.05, z: 0 };
  const down = { x: hand.x, y: -3, z: hand.z - 0.3 };
  const aimPt = { x: lerp(down.x, target.x, t), y: lerp(down.y, target.y, t), z: lerp(down.z, target.z, t) };
  const base = { x: hand.x, y: hand.y + 0.06, z: hand.z - 0.05 };
  const d = norm({ x: aimPt.x - base.x, y: aimPt.y - base.y, z: aimPt.z - base.z });

  const L = 0.24, R = 0.03;
  const tip = { x: base.x + d.x * L, y: base.y + d.y * L, z: base.z + d.z * L };
  const pg = proj(base.x, base.y, base.z), pt = proj(tip.x, tip.y, tip.z);

  // grip in hand
  ctx.fillStyle = '#4a2a14';
  ctx.beginPath(); ctx.ellipse(ph.x, ph.y + 0.02 * ph.s, 0.035 * ph.s, 0.07 * ph.s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8b48a';
  ctx.beginPath(); ctx.arc(ph.x, ph.y, 0.055 * ph.s, 0, Math.PI * 2); ctx.fill();

  // drum
  ctx.fillStyle = '#5e646e';
  ctx.beginPath(); ctx.arc(pg.x, pg.y, 0.05 * pg.s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#464b53';
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.arc(pg.x + Math.cos(a) * 0.03 * pg.s, pg.y + Math.sin(a) * 0.03 * pg.s, 0.009 * pg.s, 0, Math.PI * 2); ctx.fill(); }

  // barrel
  ctx.strokeStyle = '#7d848f'; ctx.lineWidth = 2 * R * (pg.s + pt.s) / 2;
  ctx.beginPath(); ctx.moveTo(pg.x, pg.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = R * 0.5 * pt.s;
  ctx.beginPath(); ctx.moveTo(pg.x, pg.y - R * 0.5 * pg.s); ctx.lineTo(pt.x, pt.y - R * 0.5 * pt.s); ctx.stroke();

  // muzzle face: rounder the more it faces you
  const v = norm({ x: view.x - tip.x, y: view.y - tip.y, z: -tip.z });
  const cosA = Math.max(0, d.x * v.x + d.y * v.y + d.z * v.z);
  const ang = Math.atan2(pt.y - pg.y, pt.x - pg.x), r = R * pt.s;
  ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(ang);
  ctx.fillStyle = '#8f96a1';
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(1, r * cosA), r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0b0b0d';
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(0.5, r * 0.55 * cosA), r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,240,150,${flash * 10})`;
    ctx.beginPath();
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = (i % 2 ? 0.08 : 0.28) * pt.s; ctx.lineTo(pt.x + Math.cos(a) * rr, pt.y + Math.sin(a) * rr); }
    ctx.fill();
  }
}

function drawCrack() {
  if (!crack) return;
  let s = crack.seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    let x = crack.x, y = crack.y, a = rnd() * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let j = 0; j < 6; j++) { a += (rnd() - .5) * 0.8; const l = 20 + rnd() * 60; x += Math.cos(a) * l; y += Math.sin(a) * l; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(20,10,5,.8)'; ctx.beginPath(); ctx.arc(crack.x, crack.y, 10, 0, Math.PI * 2); ctx.fill();
}

function outlined(text, x, y, size, fill, font = 'Black Han Sans') {
  ctx.font = `${size}px '${font}', sans-serif`;
  ctx.fillStyle = fill; ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = Math.max(3, size / 12);
  ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `28px 'Black Han Sans', sans-serif`; ctx.fillStyle = '#2b1a10';
  ctx.fillText(`점수 ${score}`, 18, 16);
  ctx.font = `15px 'Noto Sans KR', sans-serif`;
  ctx.fillText(`최고 ${best} · 반응 제한 ${REACT}초`, 18, 50);
  ctx.textAlign = 'right'; ctx.font = `28px sans-serif`;
  ctx.fillText('❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives)), W - 18, 16);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const m = Math.min(W, H);
  if (state === 'ready') outlined(timer > 1 ? '준비...' : '결투!', W / 2, H * 0.82, m * 0.1, '#fff4e0');

  // centre gauge: where your head is, and the middle zone you must return to
  if (state !== 'menu' && state !== 'over') {
    const gy = H - 40, gw = Math.min(W * 0.6, 420), gx = W / 2 - gw / 2;
    ctx.fillStyle = 'rgba(43,26,16,.35)'; ctx.fillRect(gx, gy - 4, gw, 8);
    const scale = gw / 1.2;
    ctx.fillStyle = state === 'center' ? 'rgba(255,244,224,.8)' : 'rgba(255,244,224,.35)';
    ctx.fillRect(W / 2 - CENTER_X * scale, gy - 10, CENTER_X * 2 * scale, 20);
    ctx.fillStyle = '#c4382a';
    ctx.beginPath(); ctx.arc(W / 2 + clamp(head.x, -0.6, 0.6) * scale, gy, 9, 0, Math.PI * 2); ctx.fill();
  }
  if (state === 'center' && msgT <= 0) outlined('얼굴을 가운데로', W / 2, H * 0.82, m * 0.05, '#fff4e0');

  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT * 2);
    outlined(msg, W / 2, H * 0.78, m * 0.08, hitFlash > 0 ? '#ff6b5a' : '#fff4e0');
    if (sub) outlined(sub, W / 2, H * 0.78 + m * 0.07, m * 0.035, '#fff4e0', 'Noto Sans KR');
    ctx.globalAlpha = 1;
  }
  if (useCamera && !faceSeen && state !== 'menu' && state !== 'over') {
    ctx.font = `bold 20px 'Noto Sans KR', sans-serif`; ctx.fillStyle = '#c4382a';
    ctx.fillText('얼굴이 안 보여요! 카메라 앞으로 오세요', W / 2, 100);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 30 * shake, (Math.random() - .5) * 30 * shake);
  drawWorld();
  drawCowboy();
  drawArmAndGun();
  ctx.restore();
  if (hitFlash > 0) { ctx.fillStyle = `rgba(196,40,30,${hitFlash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'gap') drawCrack(); else crack = null;
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(30,10,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawHUD();
}

if (new URLSearchParams(location.search).has('debug')) window.game = { get state() { return state; }, get side() { return side; }, get score() { return score; }, get lives() { return lives; } };

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

startBtn.addEventListener('click', async () => {
  audio().resume();
  if (state === 'over' || useCamera) return startGame();
  startBtn.disabled = true;
  try {
    await initCamera();
    statusEl.textContent = '';
    // let the detector see the face once so the middle can be calibrated
    for (let i = 0; i < 30 && !rawFace; i++) { updateInput(0); await new Promise(r => setTimeout(r, 50)); }
    startGame();
  } catch (e) {
    console.error(e);
    statusEl.textContent = '카메라를 사용할 수 없어요. 키보드 모드로 해보세요. (' + (e.message || e.name) + ')';
  } finally {
    startBtn.disabled = false;
  }
});
keysBtn.addEventListener('click', () => {
  audio().resume();
  useCamera = false; video.style.display = 'none';
  startGame();
});
</script>
</body>
</html>

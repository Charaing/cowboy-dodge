<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>총구를 피해라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --sand:#e9b872; --ink:#2b1a10; --red:#c4382a; --cream:#fff4e0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#1a0f08; color:var(--cream); font-family:'Noto Sans KR',sans-serif; overflow:hidden; }
  #game { display:block; width:100vw; height:100vh; }
  #cam { position:fixed; right:16px; bottom:16px; width:180px; max-width:30vw; border:3px solid var(--ink); border-radius:8px; transform:scaleX(-1); background:#000; opacity:.85; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(26,15,8,.8); text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  h1 { font-family:'Black Han Sans',sans-serif; font-size:clamp(40px,9vw,88px); margin:0; color:var(--sand); text-shadow:4px 4px 0 var(--ink); letter-spacing:2px; }
  p { margin:0; max-width:580px; line-height:1.7; }
  button { font-family:'Black Han Sans',sans-serif; font-size:24px; padding:12px 32px; border:3px solid var(--ink); background:var(--sand); color:var(--ink); border-radius:8px; cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
  button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  button.secondary { font-size:16px; padding:8px 18px; background:var(--cream); }
  #status { font-size:14px; opacity:.8; min-height:20px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="cam" autoplay playsinline muted></video>
<div id="overlay">
  <h1>총구를 피해라</h1>
  <p id="desc">카우보이가 <b>당신을</b> 겨누고 있습니다.<br>
  총구가 흔들리다가 <b>구멍이 정확히 동그랗게 보이는 순간</b> — 당신을 조준한 겁니다.<br>
  <b>0.2초</b> 안에 머리를 움직여 피하세요! (좌우로 비키거나 숙이기)<br>
  <small>웹캠이 얼굴 위치를 인식해요. 카메라에서 1m 정도 떨어져 앉으세요.</small></p>
  <button id="start">카메라로 시작</button>
  <button id="keys" class="secondary">카메라 없이 (방향키)</button>
  <div id="status"></div>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// reaction window in seconds (override with ?t=0.3)
const REACT = +(new URLSearchParams(location.search).get('t')) || 0.2;
const HIT_R = 0.13;          // metres: head must leave this radius around the locked aim
const COWBOY_Z = 3.2;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const video = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const keysBtn = document.getElementById('keys');
const descEl = document.getElementById('desc');
const titleEl = overlay.querySelector('h1');
descEl.innerHTML = descEl.innerHTML.replace('0.2초', `${REACT}초`);

let W = 0, H = 0, F = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  F = Math.min(W, H) * 1.5;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- head tracking ----------
// head = player's eye position in metres, relative to the neutral spot (x right, y up)
const head = { x: 0, y: 0 };      // raw, used for hit tests
const view = { x: 0, y: 0 };      // smoothed, used for the camera
let detector = null, useCamera = false, faceSeen = true, lastVideoTime = -1;
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

async function initCamera() {
  statusEl.textContent = '카메라 권한을 요청하는 중...';
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, frameRate: { ideal: 60 }, facingMode: 'user' }, audio: false });
  video.srcObject = stream;
  await new Promise(r => video.onloadeddata = r);
  statusEl.textContent = '얼굴 인식 모델 불러오는 중...';
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  detector = await FaceDetector.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    minDetectionConfidence: 0.5
  });
  useCamera = true;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function updateInput(dt) {
  if (useCamera && detector && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = detector.detectForVideo(video, performance.now());
    if (res.detections.length) {
      const b = res.detections[0].boundingBox;
      const cx = (b.originX + b.width / 2) / video.videoWidth;
      const cy = (b.originY + b.height / 2) / video.videoHeight;
      head.x = clamp((0.5 - cx) * 1.4, -0.6, 0.6);   // mirrored
      head.y = clamp((0.42 - cy) * 1.0, -0.4, 0.3);
      faceSeen = true;
    } else {
      faceSeen = false;
    }
  }
  if (!useCamera) {
    const sp = 3 * dt;
    if (keys['ArrowLeft']) head.x -= sp;
    if (keys['ArrowRight']) head.x += sp;
    if (keys['ArrowDown']) head.y -= sp; else if (keys['ArrowUp']) head.y += sp;
    else head.y += (0 - head.y) * Math.min(1, dt * 6);
    head.x = clamp(head.x, -0.6, 0.6); head.y = clamp(head.y, -0.4, 0.3);
  }
  const k = Math.min(1, dt * 30);
  view.x += (head.x - view.x) * k; view.y += (head.y - view.y) * k;
}

// ---------- 3D helpers ----------
function proj(x, y, z) {
  const s = F / z;
  return { x: W / 2 + (x - view.x) * s, y: H * 0.45 - (y - view.y) * s, s };
}
const norm = v => { const l = Math.hypot(v.x, v.y, v.z) || 1; return { x: v.x / l, y: v.y / l, z: v.z / l }; };

// ---------- game state ----------
let state = 'menu';          // menu | ready | stalk | lock | gap | over
let timer = 0, score = 0, lives = 3, best = 0;
const aim = { x: 0, y: 0 };      // point (z=0 plane) the barrel points at
let wander = { x: 0.3, y: 0 }, wanderT = 0;
let lockPt = null, lockTime = 0, escapedAt = -1;
let flash = 0, shake = 0, hitFlash = 0, hammer = 0, crack = null;
let msg = '', sub = '', msgT = 0;
let reactions = [];
try { best = +localStorage.getItem('cowboy-fp-best') || 0; } catch {}

function startGame() {
  score = 0; lives = 3; reactions = []; crack = null;
  state = 'ready'; timer = 2;
  overlay.classList.add('hidden');
}

function newStalk() {
  state = 'stalk';
  const d = Math.min(1, score / 20);
  timer = 1.2 + Math.random() * (2.8 - d * 1.2);
  pickWander();
}
function pickWander() {
  const a = Math.random() * Math.PI * 2, r = 0.22 + Math.random() * 0.35;
  wander = { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.6 };
  wanderT = 0.25 + Math.random() * 0.5;
}

function lockOn() {
  state = 'lock';
  lockPt = { x: head.x, y: head.y };
  aim.x = lockPt.x; aim.y = lockPt.y;
  lockTime = 0; escapedAt = -1;
  hammer = 1;
  click();
}

function fire() {
  flash = 0.1; shake = 0.35;
  bang();
  const dist = Math.hypot(head.x - lockPt.x, head.y - lockPt.y);
  if (dist < HIT_R) {
    lives--; hitFlash = 0.7;
    crack = { x: W / 2, y: H / 2, seed: Math.random() * 1000 };
    showMsg('맞았다!', `${REACT}초 안에 피하지 못했어요`);
    if (lives <= 0) { state = 'gap'; timer = 1; setTimeout(gameOver, 900); return; }
  } else {
    score++;
    const rt = escapedAt >= 0 ? escapedAt : REACT;
    reactions.push(rt);
    showMsg(['피했다!', '빠르다!', '아슬아슬!', '총알보다 빨라!'][Math.floor(Math.random() * 4)], `반응 ${rt.toFixed(3)}초`);
  }
  state = 'gap';
  timer = 1.1;
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('cowboy-fp-best', best); } catch {} }
  const avg = reactions.length ? (reactions.reduce((a, b) => a + b, 0) / reactions.length).toFixed(3) + '초' : '-';
  titleEl.textContent = '쓰러졌다...';
  descEl.innerHTML = `피한 총알 <b>${score}</b>발 · 평균 반응 <b>${avg}</b><br>최고 기록 <b>${best}</b>발`;
  startBtn.textContent = '다시 결투';
  keysBtn.style.display = 'none';
  statusEl.textContent = '';
  overlay.classList.remove('hidden');
}

function showMsg(t, s = '') { msg = t; sub = s; msgT = 1; }

// ---------- sound ----------
let actx = null;
function audio() { return actx = actx || new AudioContext(); }
function click() {
  try {
    const a = audio(), o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = 1800;
    g.gain.setValueAtTime(0.12, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.03);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.04);
  } catch {}
}
function bang() {
  try {
    const a = audio(), len = a.sampleRate * 0.35, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(), g = a.createGain();
    src.buffer = buf; g.gain.value = 0.6;
    src.connect(g).connect(a.destination); src.start();
  } catch {}
}

// ---------- update ----------
function update(dt) {
  updateInput(dt);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - dt);
  hitFlash = Math.max(0, hitFlash - dt); msgT = Math.max(0, msgT - dt * 0.9);
  hammer = Math.max(0, hammer - dt * 2);

  if (state === 'ready') {
    timer -= dt; aim.x += (head.x + 0.4 - aim.x) * dt * 3; aim.y += (head.y - 0.3 - aim.y) * dt * 3;
    if (timer <= 0) newStalk();
  } else if (state === 'stalk') {
    // barrel drifts around you, never quite on you
    wanderT -= dt; if (wanderT <= 0) pickWander();
    const tx = head.x + wander.x, ty = head.y + wander.y;
    const k = Math.min(1, dt * 7);
    aim.x += (tx - aim.x) * k; aim.y += (ty - aim.y) * k;
    timer -= dt;
    if (timer <= 0) lockOn();
  } else if (state === 'lock') {
    lockTime += dt;
    if (escapedAt < 0 && Math.hypot(head.x - lockPt.x, head.y - lockPt.y) >= HIT_R) escapedAt = lockTime;
    if (lockTime >= REACT) fire();
  } else if (state === 'gap') {
    timer -= dt;
    aim.x += (head.x + 0.5 - aim.x) * dt * 4; aim.y += (head.y - 0.5 - aim.y) * dt * 4;
    if (timer <= 0 && lives > 0) newStalk();
  }
}

// ---------- drawing ----------
function drawWorld() {
  const hor = proj(0, -1.6 + 0, 1e4).y; // horizon (eye level is y=0, ground 1.6m below)
  const sky = ctx.createLinearGradient(0, 0, 0, hor);
  sky.addColorStop(0, '#e9763a'); sky.addColorStop(0.7, '#f6c26b'); sky.addColorStop(1, '#fbe2a8');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hor + 2);

  const sun = proj(-14, 3, 80);
  ctx.fillStyle = '#fff1c1'; ctx.beginPath(); ctx.arc(sun.x, sun.y, F * 0.05, 0, Math.PI * 2); ctx.fill();

  // distant mesas (parallax)
  ctx.fillStyle = '#b5552e';
  const mesa = (x0, x1, h, z) => {
    const a = proj(x0, -1.6, z), b = proj(x1, -1.6 + h, z);
    ctx.beginPath(); ctx.moveTo(a.x - 30, a.y); ctx.lineTo(a.x, b.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + 30, a.y); ctx.fill();
  };
  mesa(-30, -16, 7, 60); mesa(10, 30, 9, 70); mesa(-60, -40, 5, 70); mesa(40, 55, 6, 60);

  const g = ctx.createLinearGradient(0, hor, 0, H);
  g.addColorStop(0, '#d99a55'); g.addColorStop(1, '#8f5326');
  ctx.fillStyle = g; ctx.fillRect(0, hor, W, H - hor);

  // a cactus for depth
  const c = proj(-2.2, -1.6, 7);
  ctx.fillStyle = '#4f7a3a';
  const u = c.s;
  ctx.fillRect(c.x - 0.12 * u, c.y - 1.6 * u, 0.24 * u, 1.6 * u);
  ctx.fillRect(c.x - 0.45 * u, c.y - 1.1 * u, 0.33 * u, 0.16 * u);
  ctx.fillRect(c.x - 0.45 * u, c.y - 1.45 * u, 0.16 * u, 0.5 * u);
}

function drawCowboy() {
  const z = COWBOY_Z;
  const chest = proj(0, -0.35, z);
  const s = chest.s / 135; // art units -> metres (art is ~135 units per metre)
  ctx.save(); ctx.translate(chest.x, chest.y); ctx.scale(s, s);
  // legs (cut by bottom of screen usually)
  ctx.fillStyle = '#3a4a6b'; ctx.fillRect(-30, 70, 24, 140); ctx.fillRect(6, 70, 24, 140);
  // torso + vest
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-40, -12, 80, 88);
  ctx.fillStyle = '#6b3a1e'; ctx.fillRect(-40, -12, 26, 88); ctx.fillRect(14, -12, 26, 88);
  ctx.fillStyle = '#e2b84a'; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4 : 9; ctx.lineTo(-27 + Math.cos(a) * r, 18 + Math.sin(a) * r); }
  ctx.fill();
  ctx.fillStyle = '#3b2010'; ctx.fillRect(-40, 66, 80, 10);
  // left arm hanging
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(-56, -8, 18, 70);
  // head
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(0, -38, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c4382a'; ctx.beginPath(); ctx.moveTo(-26, -30); ctx.lineTo(26, -30); ctx.lineTo(0, -4); ctx.fill();
  // eyes follow the aim; squint when locked
  const ex = clamp((aim.x - 0) * 8, -5, 5), ey = clamp(-(aim.y) * 6, -3, 3);
  ctx.fillStyle = '#2b1a10';
  const eh = state === 'lock' ? 2 : 4;
  ctx.fillRect(-14 + ex, -46 + ey, 10, eh); ctx.fillRect(4 + ex, -46 + ey, 10, eh);
  ctx.fillRect(-16, -54 + (state === 'lock' ? 3 : 0), 13, 3); ctx.fillRect(3, -54 + (state === 'lock' ? 3 : 0), 13, 3);
  // hat
  ctx.fillStyle = '#5a3418';
  ctx.beginPath(); ctx.ellipse(0, -60, 58, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, -60); ctx.lineTo(-25, -100); ctx.quadraticCurveTo(0, -90, 25, -100); ctx.lineTo(30, -60); ctx.fill();
  ctx.fillStyle = '#2b1a10'; ctx.fillRect(-30, -69, 60, 7);
  ctx.restore();
}

function drawGun() {
  // shoulder -> hand -> revolver; the arm reaches toward you
  const shoulder = { x: 0.32, y: -0.38, z: COWBOY_Z };
  const hand = { x: 0.14, y: -0.28, z: COWBOY_Z - 1.3 };
  const gunBase = { x: hand.x, y: hand.y + 0.06, z: hand.z - 0.05 };
  // exaggerate lateral error so "not on you" is easy to read; dead-on stays a perfect circle
  const ex = 4;
  const tx = view.x + (aim.x - view.x) * ex, ty = view.y + (aim.y - view.y) * ex;
  const d = norm({ x: tx - gunBase.x, y: ty - gunBase.y, z: -gunBase.z });

  const L = 0.22, R = 0.03;
  const back = { x: gunBase.x - d.x * 0.03, y: gunBase.y - d.y * 0.03, z: gunBase.z - d.z * 0.03 };
  const tip = { x: gunBase.x + d.x * L, y: gunBase.y + d.y * L, z: gunBase.z + d.z * L };

  // arm
  const ps = proj(shoulder.x, shoulder.y, shoulder.z), ph = proj(hand.x, hand.y, hand.z);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#b8925c'; ctx.lineWidth = 0.13 * ph.s;
  ctx.beginPath(); ctx.moveTo(ps.x, ps.y); ctx.lineTo(ph.x, ph.y); ctx.stroke();
  // hand + grip
  ctx.fillStyle = '#4a2a14';
  ctx.beginPath(); ctx.ellipse(ph.x, ph.y + 0.02 * ph.s, 0.035 * ph.s, 0.07 * ph.s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8b48a';
  ctx.beginPath(); ctx.arc(ph.x, ph.y, 0.055 * ph.s, 0, Math.PI * 2); ctx.fill();

  // hammer (cocks back on lock)
  const pb = proj(back.x, back.y, back.z);
  ctx.fillStyle = '#3b3f46';
  const hy = (0.05 + hammer * 0.03) * pb.s;
  ctx.fillRect(pb.x - 0.01 * pb.s, pb.y - hy, 0.02 * pb.s, hy);

  // drum
  const pg = proj(gunBase.x, gunBase.y, gunBase.z);
  ctx.fillStyle = '#5e646e';
  ctx.beginPath(); ctx.arc(pg.x, pg.y, 0.045 * pg.s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#464b53';
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.arc(pg.x + Math.cos(a) * 0.028 * pg.s, pg.y + Math.sin(a) * 0.028 * pg.s, 0.008 * pg.s, 0, Math.PI * 2); ctx.fill(); }

  // barrel body (projected cylinder)
  const pt = proj(tip.x, tip.y, tip.z);
  ctx.strokeStyle = '#7d848f'; ctx.lineWidth = 2 * R * (pg.s + pt.s) / 2;
  ctx.beginPath(); ctx.moveTo(pg.x, pg.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = R * 0.5 * pt.s;
  ctx.beginPath(); ctx.moveTo(pg.x, pg.y - R * 0.5 * pg.s); ctx.lineTo(pt.x, pt.y - R * 0.5 * pt.s); ctx.stroke();

  // muzzle face: ellipse whose roundness = how directly it points at you
  const v = norm({ x: view.x - tip.x, y: view.y - tip.y, z: -tip.z });
  const cosA = Math.max(0, d.x * v.x + d.y * v.y + d.z * v.z);
  const ang = Math.atan2(pt.y - pg.y, pt.x - pg.x);
  const r = R * pt.s;
  ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(ang);
  ctx.fillStyle = '#8f96a1';
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(1, r * cosA), r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0b0b0d';
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(0.5, r * 0.55 * cosA), r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // front sight
  ctx.fillStyle = '#5e646e';
  ctx.fillRect(pt.x - 0.004 * pt.s, pt.y - r - 0.012 * pt.s, 0.008 * pt.s, 0.012 * pt.s);

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,240,150,${flash * 10})`;
    ctx.beginPath();
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = (i % 2 ? 0.08 : 0.25) * pt.s; ctx.lineTo(pt.x + Math.cos(a) * rr, pt.y + Math.sin(a) * rr); }
    ctx.fill();
  }
}

function drawCrack() {
  if (!crack) return;
  let s = crack.seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    let x = crack.x, y = crack.y, a = rnd() * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let j = 0; j < 6; j++) { a += (rnd() - .5) * 0.8; const l = 20 + rnd() * 60; x += Math.cos(a) * l; y += Math.sin(a) * l; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(20,10,5,.8)'; ctx.beginPath(); ctx.arc(crack.x, crack.y, 10, 0, Math.PI * 2); ctx.fill();
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `28px 'Black Han Sans', sans-serif`; ctx.fillStyle = '#2b1a10';
  ctx.fillText(`점수 ${score}`, 18, 16);
  ctx.font = `15px 'Noto Sans KR', sans-serif`;
  ctx.fillText(`최고 ${best} · 반응 제한 ${REACT}초`, 18, 50);
  ctx.textAlign = 'right'; ctx.font = `28px sans-serif`;
  ctx.fillText('❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives)), W - 18, 16);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'ready') {
    ctx.font = `${Math.min(W, H) * 0.1}px 'Black Han Sans', sans-serif`;
    ctx.fillStyle = '#fff4e0'; ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = 6;
    const t = timer > 1 ? '준비...' : '결투!';
    ctx.strokeText(t, W / 2, H * 0.8); ctx.fillText(t, W / 2, H * 0.8);
  }
  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT * 2);
    ctx.font = `${Math.min(W, H) * 0.08}px 'Black Han Sans', sans-serif`;
    ctx.fillStyle = hitFlash > 0 ? '#ff6b5a' : '#fff4e0';
    ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = 6;
    ctx.strokeText(msg, W / 2, H * 0.78); ctx.fillText(msg, W / 2, H * 0.78);
    if (sub) {
      ctx.font = `bold ${Math.min(W, H) * 0.035}px 'Noto Sans KR', sans-serif`; ctx.lineWidth = 4;
      ctx.strokeText(sub, W / 2, H * 0.78 + Math.min(W, H) * 0.07); ctx.fillText(sub, W / 2, H * 0.78 + Math.min(W, H) * 0.07);
    }
    ctx.globalAlpha = 1;
  }
  if (useCamera && !faceSeen && state !== 'menu' && state !== 'over') {
    ctx.font = `bold 20px 'Noto Sans KR', sans-serif`; ctx.fillStyle = '#c4382a';
    ctx.fillText('얼굴이 안 보여요! 카메라 앞으로 오세요', W / 2, 100);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 30 * shake, (Math.random() - .5) * 30 * shake);
  drawWorld();
  drawCowboy();
  drawGun();
  ctx.restore();
  if (hitFlash > 0) { ctx.fillStyle = `rgba(196,40,30,${hitFlash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (hitFlash > 0 || state === 'gap') drawCrack();
  if (state !== 'gap') crack = null;
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(30,10,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawHUD();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

startBtn.addEventListener('click', async () => {
  audio().resume();
  if (state === 'over' || useCamera) return startGame();
  startBtn.disabled = true;
  try {
    await initCamera();
    statusEl.textContent = '';
    startGame();
  } catch (e) {
    console.error(e);
    statusEl.textContent = '카메라를 사용할 수 없어요. 키보드 모드로 해보세요. (' + (e.message || e.name) + ')';
  } finally {
    startBtn.disabled = false;
  }
});
keysBtn.addEventListener('click', () => {
  audio().resume();
  useCamera = false; video.style.display = 'none';
  startGame();
});
</script>
</body>
